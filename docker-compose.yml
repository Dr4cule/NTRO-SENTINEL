services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: ["redis-data:/data"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      ALERT_DB: /data/sentinel.db
      # Write endpoints (POST /api/alerts, POST /api/ingest) are CLOSED unless this is set —
      # compose refuses to start without it. Generate with:
      #   python3 -c "import secrets;print(secrets.token_urlsafe(32))"
      SENTINEL_API_TOKEN: ${SENTINEL_API_TOKEN:?set SENTINEL_API_TOKEN in .env or the environment}
      MAX_UPLOAD_MB: "100"
    # :ro is NOT possible here — /data IS the alert store (sentinel.db) and is this service's
    # product. F-24 as "mount it read-only" would break ingestion. The hardening that IS
    # available on a write mount is nosuid,nodev,noexec, which block setuid execution, device
    # nodes and file execution from the bind mount without touching write access.
    volumes: ["./artifacts:/data:nosuid,nodev,noexec"]
    ports: ["8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: {resources: {limits: {memory: 256M, cpus: '0.50'}}}
  worker:
    build: .
    command: ["python", "-m", "engine.stream_consumer"]
    environment:
      ALERT_DB: /data/sentinel.db
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_DIR: /data
      MAX_UPLOAD_MB: "100"
    volumes: ["./artifacts:/data:nosuid,nodev,noexec"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      redis:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: {resources: {limits: {memory: 512M, cpus: '1.00'}}}
  trainer:
    build: .
    command: ["python", "-m", "models.train_models"]
    environment: {MODEL_DIR: /data/models}
    # Offline build tool. It genuinely must write the model artifact, so this is the one mount
    # where rw is unavoidable — but noexec/nosuid/nodev still apply, and the service is
    # profile-gated so it never starts with the runtime stack.
    volumes: ["./models/artifacts:/data/models:nosuid,nodev,noexec"]
    profiles: ["tools"]
    # Runs as root ONLY to write the bind-mounted model artifact. This leaves root-owned files
    # in models/artifacts; chown them back before the next non-root run (see docs/OPERATIONS).
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  evaluator:
    build: .
    command: ["python", "-m", "models.evaluate_models"]
    environment: {MODEL_DIR: /data/models}
    volumes: ["./models/artifacts:/data/models:nosuid,nodev,noexec"]
    profiles: ["tools"]
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  redis-data:
