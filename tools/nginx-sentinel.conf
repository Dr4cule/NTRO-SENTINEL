# NTRO Sentinel - public front door.
#
# Serves the analyst dashboard on plain port 80 so nobody has to know about :8001.
# The app itself stays on 8001; this is only a reverse proxy in front of it.
#
# Two settings here are load-bearing, not decoration:
#
#  * client_max_body_size - nginx's DEFAULT is 1m. The API accepts captures up to
#    MAX_UPLOAD_MB (100). Without this, every upload over 1 MB would die at nginx with
#    "413 Request Entity Too Large" and the analyst would blame the dashboard.
#
#  * the Upgrade/Connection headers - the dashboard's live feed is a WebSocket
#    (/ws/alerts, built from location.host). Without the upgrade headers nginx returns
#    200/101-less responses and the browser silently falls back to 5-second polling.
#    The "Connection" value must literally be "upgrade" or the hop is not a websocket.
#
# proxy_set_header Host $host is also deliberate: api/main.py validates the WebSocket
# Origin against the Host header (CSWSH protection) and rejects a mismatch with 1008.
# $host is the hostname without the port, which is exactly what the browser puts in Origin.

upstream sentinel_api {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=15s;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 100m;
    client_body_timeout 120s;

    access_log /var/log/nginx/sentinel.access.log;
    error_log  /var/log/nginx/sentinel.error.log;

    # analyst enclave: nothing here should ever be framed or sniffed
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://sentinel_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (see header note above)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Ingest of a large capture is CPU-bound and runs in the API's threadpool, so the
        # response can legitimately take minutes. nginx's 60s default would cut it off while
        # the analysis is still running.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
